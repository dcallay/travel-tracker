<world-coverage-map
  [attr.data]="dataAttr()"
  [attr.fit]="fit() ?? null"
  [attr.height]="height()"
  [attr.country]="country() ?? null"
  [attr.cities]="citiesAttr()"
  [attr.labels]="labelsAttr()"
  (country-select)="onCountrySelect($event)"
  (city-select)="onCitySelect($event)"
></world-coverage-map>
