@let a = t().addVisit;

<div class="tt-add">
  <h4>{{ t().header.addVisit }}</h4>
  <p class="tt-lead">{{ a.lead }}</p>
  <div class="tt-add__fields">
    <div class="field">
      <label for="tt-place">{{ a.place }}</label>
      <input id="tt-place" class="input" type="text" value="Quito, Ecuador" />
    </div>
    <div>
      <div class="tt-add__seg-label">{{ a.coverageType }}</div>
      <div class="seg">
        <label class="seg-opt">
          <input type="radio" name="tt-cov" checked /><span>{{ a.neighbourhood }}</span>
        </label>
        <label class="seg-opt">
          <input type="radio" name="tt-cov" /><span>{{ a.landmark }}</span>
        </label>
        <label class="seg-opt">
          <input type="radio" name="tt-cov" /><span>{{ a.discovery }}</span>
        </label>
      </div>
      <div class="tt-add__hint">{{ a.hint }}</div>
    </div>
    <div class="tt-add__row">
      <div class="field">
        <label for="tt-name">{{ a.name }}</label>
        <input id="tt-name" class="input" type="text" [placeholder]="a.namePlaceholder" />
      </div>
      <div class="field">
        <label for="tt-date">{{ a.date }}</label>
        <input id="tt-date" class="input" type="text" [value]="t().formatDate(sampleDate)" />
      </div>
    </div>
    <div class="field">
      <label for="tt-notes">{{ a.notes }}</label>
      <textarea id="tt-notes" class="input" [placeholder]="a.notesPlaceholder"></textarea>
    </div>
    <div class="tt-add__actions">
      <button type="button" class="btn btn-primary" (click)="navigation.finishAdd()">
        {{ a.save }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="navigation.finishAdd()">
        {{ a.cancel }}
      </button>
      <span class="tt-add__source">{{ a.source }}</span>
    </div>
  </div>
</div>
