@let city = view();

<app-place-detail
  [flag]="city.flag"
  [kicker]="city.kicker"
  [title]="city.name"
  [place]="city.placeLabel"
>
  <div detail-main>
    <app-score-summary
      [pct]="city.pct"
      [label]="t().metric"
      [bar]="city.bar"
      [formula]="city.formula"
      (infoActivate)="dialogs.openHow()"
    />
    <app-score-breakdown
      [cells]="[
        {
          label: t().detail.neighbourhoods,
          value: city.nRatio,
          note: t().detail.weightEach(1),
          lang: t().locale,
        },
        { label: t().detail.landmarks, value: city.lRatio, note: t().detail.weightEach(2) },
      ]"
    />
  </div>

  <div detail-side>
    <app-lks-panel
      [count]="city.discCount"
      [items]="city.discList"
      [note]="t().cityDiscoveriesNote"
    />

    <div class="tt-open-list">
      <app-section-head [label]="t().city.openHead" [note]="city.openCount" />
      @for (place of city.openList; track place.name) {
        <div class="tt-open-row">
          <span>{{ place.name }}</span>
          <span class="tag tag-neutral">{{ place.kind }}</span>
        </div>
      }
    </div>
  </div>
</app-place-detail>
