@let l = t().left;

<div class="tt-left">
  <h4>{{ l.title }}</h4>
  <p class="tt-lead">{{ l.lead }}</p>
  <table class="table tt-left__table">
    <thead>
      <tr>
        <th>{{ l.place }}</th>
        <th class="tt-col-metric">{{ t().metric }}</th>
        <th>{{ l.open }}</th>
        <th class="tt-col-disc">{{ l.discoveries }}</th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.path.join('-')) {
        <tr (click)="navigation.goTo(row.path)" class="tt-clickable-row">
          <td>
            <div class="tt-row-name">{{ row.name }}</div>
            <div class="tt-row-meta">{{ row.where }}</div>
          </td>
          <td><app-coverage-cell [bar]="row.bar" [pct]="row.pct" /></td>
          <td class="tt-row-meta">{{ t().city.openCount(row.openN, row.openL) }}</td>
          <td class="tt-row-disc">{{ row.disc }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
