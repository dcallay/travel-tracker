<header class="tt-header">
  <div class="tt-crumbs">
    @for (crumb of crumbs(); track crumb.label) {
      <a class="tt-crumb" [class.is-active]="crumb.active" [routerLink]="crumb.link">
        {{ crumb.label }}
      </a>
      @if (crumb.sep) {
        <span class="tt-crumb__sep">{{ crumb.sep }}</span>
      }
    }
  </div>

  <app-lang-menu />

  <button type="button" class="btn btn-secondary" (click)="dialogs.openPhoto()">
    {{ t().header.confirmDetections(2) }}
  </button>
  <a class="btn btn-primary" routerLink="/add">{{ t().header.addVisit }}</a>
</header>
