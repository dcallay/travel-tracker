@if (copy(); as c) {
  <app-dialog (dismissed)="dialogs.closeFeedback()">
    <div class="dialog-kicker">{{ c.kicker }}</div>
    <div class="dialog-title">{{ c.title }}</div>
    @if (dialogs.feedbackSent()) {
      <div>
        <div class="dialog-body">{{ c.thanks }}</div>
        <div class="dialog-actions">
          <button type="button" class="btn btn-primary" (click)="dialogs.closeFeedback()">
            {{ t().feedback.close }}
          </button>
        </div>
      </div>
    } @else {
      <div>
        @if (c.hasPlace) {
          <div class="tt-dialog-about">
            <div class="tt-section-label">{{ t().feedback.about }}</div>
            <div class="tt-dialog-about__place">{{ c.place }}</div>
          </div>
        }
        @if (c.isReport) {
          <div class="field tt-dialog-seg">
            <label>{{ t().feedback.whatIsWrong }}</label>
            <div class="seg">
              @for (reason of t().feedback.reasons; track $index) {
                <label class="seg-opt">
                  <input type="radio" name="tt-fb" [checked]="$first" /><span>{{ reason }}</span>
                </label>
              }
            </div>
          </div>
        }
        <div class="field">
          <label>{{ c.fieldLabel }}</label>
          <textarea class="input" rows="4" [placeholder]="c.placeholder"></textarea>
        </div>
        <div class="field tt-dialog-email">
          <label>{{ t().feedback.email }}</label>
          <input class="input" type="email" [placeholder]="t().feedback.emailPlaceholder" />
        </div>
        <div class="dialog-actions">
          <button type="button" class="btn btn-secondary" (click)="dialogs.closeFeedback()">
            {{ t().feedback.cancel }}
          </button>
          <button type="button" class="btn btn-primary" (click)="dialogs.sendFeedback()">
            {{ t().feedback.send }}
          </button>
        </div>
      </div>
    }
  </app-dialog>
}
