@if (dialogs.photoOpen()) {
  @let p = t().photo;
  @let d = detection;
  <app-dialog (dismissed)="dialogs.closePhoto()">
    <div class="dialog-kicker">{{ p.kicker }}</div>
    <div class="dialog-title">{{ p.title(d.place) }}</div>
    <div class="dialog-body">{{ p.body(d.city, t().formatDate(d.taken), d.metres) }}</div>
    <div class="tt-dialog-meta">
      <div>
        <div class="tt-section-label">{{ p.confidence }}</div>
        <div class="tt-dialog-meta__value">{{ d.confidence }}</div>
      </div>
      <div>
        <div class="tt-section-label">{{ p.source }}</div>
        <div class="tt-dialog-meta__value">{{ p.sourceValue }}</div>
      </div>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" (click)="dialogs.closePhoto()">
        {{ p.reject }}
      </button>
      <button type="button" class="btn btn-primary" (click)="dialogs.closePhoto()">
        {{ p.confirm }}
      </button>
    </div>
  </app-dialog>
}
